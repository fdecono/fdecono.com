{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1">
    <link rel="shortcut icon" href="/favicon.ico?v=1">
    <link rel="apple-touch-icon" href="/favicon.ico?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="noise"></div>
    
    <!-- Main Content -->
    <main>
        {{template "content" .}}
    </main>

    <!-- Footer -->
    <footer>
        <div style="max-width: 1100px; margin: 0 auto; padding: 2rem; text-align: center; line-height: 1.6;">
            <p>&copy; 2025 <a href="https://github.com/fdecono" target="_blank" rel="noopener noreferrer">fdecono</a>. Built with Go and htmx.</p>
        </div>
    </footer>
</body>
</html>
{{end}}
